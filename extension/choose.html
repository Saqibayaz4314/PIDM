<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIDM — Video quality</title><link rel="icon" href="icons/pidm-32.png"><script src="theme.js"></script><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="choose.css"><script type="module" src="choose.js"></script></head><body><main class="extension-card"><header class="extension-header"><div class="brand"><img src="icons/pidm-48.png" width="36" height="36" alt=""><span><strong>PIDM</strong><small>Browser connect</small></span></div><div class="theme-switch" role="group" aria-label="Appearance"><button data-theme-choice="light" aria-label="Light theme"><svg class="icon"><use href="icons.svg#sun"/></svg></button><button data-theme-choice="dark" aria-label="Dark theme"><svg class="icon"><use href="icons.svg#moon"/></svg></button></div></header><div class="extension-content"><span class="dialog-kicker">NEW VIDEO DOWNLOAD</span><h1>Choose your quality.</h1><p id="title">Reading available qualities…</p><p id="source"></p><form id="download-form"><label for="quality">Video resolution</label><select id="quality" disabled><option value="best">Best available</option></select><p id="note">Only qualities available on this video will appear.</p><div class="extension-actions"><button class="button primary" id="download" type="submit" disabled><svg class="icon"><use href="icons.svg#download"/></svg>Download video</button><button class="button secondary" id="retry" type="button">Refresh qualities</button><button class="button secondary" id="cancel" type="button">Cancel</button></div></form><p id="status" role="status" class="extension-status"></p></div><footer class="extension-footer"><svg class="icon"><use href="icons.svg#shield"/></svg>Downloaded straight to your device</footer></main></body></html>
